<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>

    <script>
        function somar(){
            result.value = parseInt (v1.value) + parseInt (v2.value);
        }
    </script>
</head>
<body>
    <h2>Somas de dois Números</h2>
    Valor 1: <input type="text" id="v1"><br><br>
    Valor 2: <input type="text" id="v2"><br><br>

    <button onclick="somar()">Somar</button><br><br>

    Resultado: <input type="text" id="result" value="0" , readonly>

</body>
</html>
